version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # trailing "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Everything that has to move in lockstep with an Angular major: the
      # framework, its CLI/builders, angular-eslint and jest-preset-angular
      # (both pin a peer range on @angular/*), and TypeScript. Split across two
      # PRs, neither side compiles on its own (see closed #10/#11).
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'angular-eslint'
          - '@angular-eslint/*'
          - 'jest-preset-angular'
          - 'zone.js'
          - 'typescript'
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'angular-eslint'
          - '@angular-eslint/*'
          - 'jest-preset-angular'
          - 'typescript'
    ignore:
      # Angular's compiler accepts one TypeScript minor range per release
      # (22.x: >=6.0 <6.1). A TypeScript major is only ever safe as part of an
      # Angular major, which `ng update` handles, so Dependabot doesn't
      # propose it on its own.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Build stage tracks Node's Active LTS line (same as CI's node-version);
      # odd/Current majors are bumped by hand once they become LTS.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
