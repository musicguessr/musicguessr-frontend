# Content-Security-Policy, included next to security-headers.conf by every
# location EXCEPT the service worker scripts. A worker is governed by the CSP
# of its own script response, and every fetch it proxies counts as
# connect-src there — with this policy on ngsw-worker.js, the worker's
# pass-through fetches of the YouTube/Spotify SDKs and Google Fonts were
# refused and surfaced to the page as 504s from the second visit on.
#
# __API_ORIGIN__ is replaced at container start by the entrypoint (API_URL's
# scheme://host), so a backend on its own domain keeps working. Per directive:
#   script-src  no inline scripts anywhere (GA's loader is /ga.js, critical-CSS
#               inlining is off so there's no onload handler); the three
#               playback SDKs and the optional GA tag.
#   style-src   'unsafe-inline' is required: Angular injects component styles
#               as <style> elements and the YouTube player sets inline styles.
#   img-src     album artwork comes from many metadata providers' CDNs.
#   media-src   MusicKit streams (blob: via MSE) from Apple's CDNs.
#   connect-src our API, Spotify token/Web API, MusicKit's API hosts, GA.
#   cloudflareinsights: Cloudflare Web Analytics, which Cloudflare injects
#               into proxied HTML itself (script + beacon POST).
#   frame-src   YouTube player, Spotify SDK's hidden iframe, Apple auth/embed.
# Violations are logged by the backend ("csp violation") via report-uri.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://sdk.scdn.co https://js-cdn.music.apple.com https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.apple.com https://*.mzstatic.com https://*.scdn.co; connect-src 'self' __API_ORIGIN__ https://accounts.spotify.com https://api.spotify.com https://*.apple.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://cloudflareinsights.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://sdk.scdn.co https://*.apple.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; report-uri __API_ORIGIN__/api/csp-report" always;
