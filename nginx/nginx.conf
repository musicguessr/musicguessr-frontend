worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Temp dirs writable by non-root user
  client_body_temp_path /tmp/nginx_client 1 2;
  proxy_temp_path       /tmp/nginx_proxy;
  fastcgi_temp_path     /tmp/nginx_fastcgi;
  uwsgi_temp_path       /tmp/nginx_uwsgi;
  scgi_temp_path        /tmp/nginx_scgi;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # This container always sits behind a reverse proxy (edge/cloudflared in
    # production, or the k8s Ingress) on a different public port — without
    # this, nginx's own directory-redirect for a bare prerendered route (e.g.
    # /create-deck -> /create-deck/) builds an absolute Location header from
    # $host:$server_port, leaking the internal :8080 straight through the
    # proxy to the public Internet as a dead redirect.
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Angular SPA routing
    location / {
      try_files $uri $uri/ /index.html;
    }

    # config.json — allow mounting custom config at runtime
    location = /config.json {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri =404;
    }

    # Service worker control files must never be cached by the browser or any
    # intermediary. ngsw.json is how a client discovers that a new app version
    # exists, and ngsw-worker.js is the worker itself — serving either from
    # cache pins clients to the deployed-at-install version indefinitely,
    # which is the classic way a PWA becomes impossible to update.
    location ~* ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri =404;
    }

    # index.html is rewritten at runtime by the entrypoint and names the
    # content-hashed bundles for this deploy — a cached copy points at chunk
    # filenames that no longer exist after the next one.
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri =404;
    }

    # SEO / crawler files — no-cache so runtime-injected values are always fresh
    location = /robots.txt {
      add_header Content-Type "text/plain; charset=utf-8";
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri =404;
    }

    location = /sitemap.xml {
      add_header Content-Type "application/xml; charset=utf-8";
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      try_files $uri =404;
    }

    location = /llms.txt {
      add_header Content-Type "text/plain; charset=utf-8";
      add_header Cache-Control "public, max-age=86400";
      try_files $uri =404;
    }

    # Cache hashed assets forever
    location ~* \.[0-9a-f]+\.(js|css|woff2|woff|png|jpg|svg|ico)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
