worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

  # Temp dirs writable by non-root user
  client_body_temp_path /tmp/nginx_client 1 2;
  proxy_temp_path       /tmp/nginx_proxy;
  fastcgi_temp_path     /tmp/nginx_fastcgi;
  uwsgi_temp_path       /tmp/nginx_uwsgi;
  scgi_temp_path        /tmp/nginx_scgi;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # This container always sits behind a reverse proxy (edge/cloudflared in
    # production, or the k8s Ingress) on a different public port — without
    # this, nginx's own directory-redirect builds an absolute Location header
    # from $host:$server_port, leaking the internal :8080 to the Internet.
    absolute_redirect off;

    # Unknown URLs get a real 404 status. The body is the client-only app
    # shell (index.csr.html — Angular emits it because '' is prerendered, so
    # index.html itself is the English landing page), whose router renders a
    # localized "not found" page. Serving index.html with 200 here made every
    # typo'd or mixed-case URL an indexable duplicate of the English home.
    error_page 404 /index.csr.html;

    location = /index.csr.html {
      internal;
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "no-cache" always;
      add_header X-Robots-Tag "noindex" always;
    }

    location @asset_missing {
      default_type text/plain;
      return 404 "Not found\n";
    }

    # Prerendered pages ({route}/index.html, including locale-prefixed ones
    # like /pl/faq/index.html) and every other file. $uri/index.html is an
    # explicit file path rather than $uri/ (a directory match): the directory
    # form serves those pages via a 301 to the trailing-slash URL, which
    # contradicted the no-slash canonical/sitemap URLs.
    location / {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/index.html =404;
    }

    # Duplicate URL forms of prerendered pages → their canonical form.
    # (/index.html itself stays reachable: the service worker fetches it.)
    location ~ ^(/.+)/$ {
      return 301 $1$is_args$args;
    }
    location ~ ^/(.+)/index\.html$ {
      return 301 /$1$is_args$args;
    }

    # Client-rendered app routes: no prerendered file, served by the app
    # shell, never indexed. robots.txt must NOT disallow these — a crawler
    # has to fetch them to see this header.
    location ~ ^/(?:(?:pl|de|nl)/)?(?:play|scan|game|callback|deck)(?:/[A-Za-z0-9_-]*)?$ {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "no-cache" always;
      add_header X-Robots-Tag "noindex" always;
      try_files /index.csr.html =404;
    }

    # Content-hashed build output (main-ERGNAKE3.js, chunk-HVELLAPK.js,
    # styles-EAR4WNOV.css): the filename changes whenever the content does.
    # The old pattern here (\.[0-9a-f]+\.js) matched webpack-era names, not
    # the application builder's, so every bundle was served no-store.
    location ~ "-[A-Z0-9]{8}\.(?:js|mjs|css)$" {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      error_page 404 @asset_missing;
      try_files $uri =404;
    }

    location ~ ^/(?:assets|media)/ {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "public, max-age=86400" always;
      error_page 404 @asset_missing;
      try_files $uri =404;
    }

    # Rewritten at container start by the entrypoint, or the source of truth
    # for "is there a new version" — must always be revalidated.
    location = /index.html {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }
    location = /config.json {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }
    location = /version.json {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # Service worker control files: serving either from cache pins clients
    # to an old app version indefinitely.
    location ~ ^/(?:ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
      # No csp.conf here: a worker script's CSP governs every fetch the
      # worker proxies (see csp.conf).
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      error_page 404 @asset_missing;
      try_files $uri =404;
    }

    location = /robots.txt {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "no-cache" always;
      charset utf-8;
      try_files $uri =404;
    }
    location = /sitemap.xml {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "no-cache" always;
      types { }
      default_type "application/xml; charset=utf-8";
      try_files $uri =404;
    }
    location = /llms.txt {
      include /etc/nginx/security-headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "public, max-age=86400" always;
      charset utf-8;
      try_files $uri =404;
    }
  }
}
