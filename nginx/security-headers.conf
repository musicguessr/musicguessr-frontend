# Included in every location that sets its own add_header. nginx only
# inherits server-level add_header directives into locations that define
# none of their own, so declaring these once at server level (as this config
# used to) silently sent none of them on any response.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera stays allowed for the QR scanner; nothing else is used.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Deliberately not a full script/style CSP yet — YouTube IFrame API, the
# Spotify SDK, MusicKit and optional GA would all need allowlisting and
# testing per provider. These directives are safe on their own.
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
