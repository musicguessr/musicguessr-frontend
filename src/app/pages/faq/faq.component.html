<main class="page">
  <div class="page-header">
    <a class="logo" [routerLink]="'/' | localize">{{ i18n.t('common.logo') }}</a>
    <app-language-switcher />
  </div>

  <div class="content">
    <h1 class="heading">{{ i18n.t('faq.heading') }}</h1>
    <p class="intro">{{ i18n.t('faq.intro') }}</p>

    <dl class="faq-list">
      @for (item of items(); track $index; let i = $index) {
        <div class="faq-item" [class.open]="item.open">
          <dt>
            <button class="faq-trigger" [attr.aria-expanded]="item.open" (click)="toggle(i)">
              <span>{{ item.q }}</span>
              <span class="faq-icon">{{ item.open ? '−' : '+' }}</span>
            </button>
          </dt>
          <!-- Always in the DOM (collapsed via [hidden]) so the prerendered
               HTML contains every answer — the FAQPage JSON-LD must match
               visible page content, and the answers are the text that ranks. -->
          <dd class="faq-answer" [hidden]="!item.open">{{ item.a }}</dd>
        </div>
      }
    </dl>

    <div class="faq-footer">
      <p>{{ i18n.t('faq.stillHaveQuestions') }}</p>
      <a class="btn btn-ghost faq-gh-link" href="https://github.com/musicguessr" rel="noopener" target="_blank">
        {{ i18n.t('faq.openIssue') }}
      </a>
    </div>
  </div>
</main>
