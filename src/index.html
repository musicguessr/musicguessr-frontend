<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport" />

    <!-- Favicon -->
    <link
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>"
      rel="icon"
      type="image/svg+xml"
    />

    <!-- Primary meta -->
    <title>musicguessr — Play Hitster cards with YouTube, Spotify & Apple Music</title>
    <meta
      content="Play any Hitster card with YouTube, Spotify or Apple Music — no subscription lock-in. Scan QR codes, guess the year, create and share custom music quiz decks."
      name="description"
    />
    <meta content="musicguessr" name="author" />
    <meta content="index,follow" name="robots" />
    <link href="__SITE_URL__" rel="canonical" />

    <!-- Search engine verification — tokens injected at runtime via entrypoint.sh -->
    <meta content="__GOOGLE_VERIFICATION__" name="google-site-verification" />
    <meta content="__BING_VERIFICATION__" name="msvalidate.01" />

    <!-- Google Analytics 4 — no-op unless GA_MEASUREMENT_ID is set (see ga.js).
         External rather than inline so the CSP can forbid inline scripts. -->
    <script async src="/ga.js"></script>

    <!-- Open Graph / Facebook -->
    <meta content="website" property="og:type" />
    <meta content="musicguessr" property="og:site_name" />
    <meta content="musicguessr — Play Hitster cards with YouTube, Spotify & Apple Music" property="og:title" />
    <meta
      content="Play any Hitster card with YouTube, Spotify or Apple Music — no subscription lock-in. Scan QR codes, guess the year, create and share custom music quiz decks."
      property="og:description"
    />
    <meta content="__SITE_URL__" property="og:url" />
    <meta content="__SITE_URL__/assets/og-image.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta content="en_US" property="og:locale" />

    <!-- Twitter / X Cards -->
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="musicguessr — Play Hitster cards with YouTube, Spotify & Apple Music" name="twitter:title" />
    <meta
      content="Play any Hitster card with YouTube, Spotify or Apple Music — no lock-in. Guess the year, create custom music quiz decks."
      name="twitter:description"
    />
    <meta content="__SITE_URL__/assets/og-image.png" name="twitter:image" />

    <!-- PWA -->
    <meta content="#0a0a0a" name="theme-color" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <meta content="musicguessr" name="apple-mobile-web-app-title" />
    <link href="/manifest.webmanifest" rel="manifest" />

    <!-- Structured data (WebApplication, HowTo, FAQPage) is injected per-page
         by SeoService (see landing/how-to-play/faq components) rather than
         hardcoded here — this shell HTML is shared by every route (SPA
         fallback + prerendered pages alike), so a global block here would
         have put e.g. FAQPage schema on /game and /deck/:id too, which
         doesn't match those pages' actual content. -->

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="dns-prefetch" />
    <link href="https://fonts.gstatic.com" rel="dns-prefetch" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Playback providers — only one is ever actually used per session
         (provider is locked at /play), but preconnecting to all three up
         front is cheap (idle TCP+TLS handshakes, no requests) and means
         whichever one gets chosen doesn't pay that latency cold on the
         very first real request once a card is scanned. -->
    <link href="https://www.youtube.com" rel="preconnect" />
    <link href="https://www.youtube-nocookie.com" rel="preconnect" />
    <link href="https://sdk.scdn.co" rel="preconnect" />
    <link href="https://accounts.spotify.com" rel="preconnect" />
    <link href="https://api.spotify.com" rel="preconnect" />
    <link href="https://js-cdn.music.apple.com" rel="preconnect" />
    <base href="/" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
